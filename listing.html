<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل الحساب</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="container nav"><a class="logo" href="index.html">Market<span>Hub</span></a><nav><a href="index.html">الرئيسية</a><a href="sell.html">بيع حساب</a></nav></div></header><main class="form-page"><div class="form-card" id="details"></div></main><script>
const id=new URLSearchParams(location.search).get('id');const seed=[{id:1,platform:"Instagram",title:"حساب Instagram متخصص في التقنية",followers:"18.4K",price:120,niche:"Technology",age:"3 سنوات",cls:"ig",icon:"◎"},{id:2,platform:"YouTube",title:"قناة YouTube محتوى تعليمي",followers:"42K",price:390,niche:"Education",age:"4 سنوات",cls:"yt",icon:"▶"},{id:3,platform:"TikTok",title:"حساب TikTok محتوى ترفيهي",followers:"75K",price:260,niche:"Entertainment",age:"2 سنوات",cls:"tt",icon:"♪"}];const all=[...JSON.parse(localStorage.getItem('mh_listings')||'[]'),...seed];const x=all.find(a=>String(a.id)===String(id));document.getElementById('details').innerHTML=x?`<span class="eyebrow">${x.platform}</span><h1>${x.title}</h1><div class="chips"><span class="chip">${x.followers} متابع/مشترك</span><span class="chip">${x.niche}</span><span class="chip">عمر ${x.age}</span></div><p style="line-height:2;color:#667085">${x.description||'عرض رقمي متاح للشراء بعد إتمام عملية التحقق والمراجعة.'}</p><hr style="border:0;border-top:1px solid #eaecf0;margin:25px 0"><div class="listing-bottom"><span class="price">$${x.price}</span><button class="btn primary" onclick="alert('سيتم تفعيل نظام الدفع والطلب في المرحلة التالية.')">شراء الآن</button></div>`:'<h1>العرض غير موجود</h1><a class="btn primary" href="index.html">العودة للرئيسية</a>';
</script></body></html>
