<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إنشاء حساب - MarketHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar"><div class="container nav"><a class="logo" href="index.html">Market<span>Hub</span></a></div></header>
<main class="form-page">
<div class="form-card">
<span class="eyebrow">Join Marketplace</span>
<h1>إنشاء حساب</h1>
<form id="registerForm">
<div class="form-grid">
<div class="field"><label for="name">الاسم</label><input id="name" required></div>
<div class="field"><label for="username">اسم المستخدم</label><input id="username" required></div>
<div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required></div>
<div class="field"><label for="phone">رقم الهاتف</label><input id="phone" type="tel"></div>
<div class="field full"><label for="password">كلمة المرور</label><input id="password" type="password" minlength="8" required></div>
</div>
<button id="registerBtn" class="btn primary" style="width:100%" type="submit">إنشاء الحساب</button>
<p id="message" style="margin-top:12px"></p>
</form>
<p>لديك حساب؟ <a href="login.html" style="color:#635bff">تسجيل الدخول</a></p>
</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile, setPersistence, browserLocalPersistence }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyDFVBBCpwx_afmIvpvs7rJscYXEYO2qrYk",
  authDomain: "markethub-84d49.firebaseapp.com",
  projectId: "markethub-84d49",
  storageBucket: "markethub-84d49.firebasestorage.app",
  messagingSenderId: "333098836937",
  appId: "1:333098836937:web:a4ec75dc26fd51a8e37e18",
  measurementId: "G-R6XLKWQM9G"
};
const auth=getAuth(initializeApp(firebaseConfig));
const form=document.getElementById("registerForm"),btn=document.getElementById("registerBtn"),msg=document.getElementById("message");
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const name=document.getElementById("name").value.trim(), email=document.getElementById("email").value.trim(), password=document.getElementById("password").value;
 if(password.length<8){msg.textContent="كلمة المرور يجب أن تكون 8 أحرف على الأقل.";return;}
 btn.disabled=true;btn.textContent="جاري إنشاء الحساب...";msg.textContent="";
 try{
  await setPersistence(auth,browserLocalPersistence);
  const credential=await createUserWithEmailAndPassword(auth,email,password);
  if(name) await updateProfile(credential.user,{displayName:name});
  window.location.replace("index.html");
 }catch(error){
  const m={
   "auth/email-already-in-use":"هذا البريد الإلكتروني مستخدم بالفعل.",
   "auth/invalid-email":"البريد الإلكتروني غير صحيح.",
   "auth/weak-password":"كلمة المرور ضعيفة. استخدم 8 أحرف على الأقل.",
   "auth/unauthorized-domain":"نطاق الموقع غير مضاف إلى Authorized domains في Firebase.",
   "auth/operation-not-allowed":"تسجيل الدخول بالبريد الإلكتروني غير مفعّل في Firebase."
  };
  msg.textContent=m[error.code]||("حدث خطأ: "+error.code);msg.style.color="#d33";btn.disabled=false;btn.textContent="إنشاء الحساب";
 }
});
</script>
</body>
</html>
