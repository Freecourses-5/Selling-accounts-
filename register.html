<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إنشاء حساب</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="container nav">
    <a class="logo" href="index.html">Market<span>Hub</span></a>
  </div>
</header>

<main class="form-page">
  <div class="form-card">
    <span class="eyebrow">Join Marketplace</span>
    <h1>إنشاء حساب</h1>

    <form id="registerForm">
      <div class="form-grid">
        <div class="field">
          <label for="name">الاسم</label>
          <input id="name" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="username">اسم المستخدم</label>
          <input id="username" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="phone">رقم الهاتف</label>
          <input id="phone" type="tel" autocomplete="tel">
        </div>

        <div class="field full">
          <label for="password">كلمة المرور</label>
          <input id="password" type="password" autocomplete="new-password" required minlength="8">
        </div>
      </div>

      <button class="btn primary" style="width:100%" type="submit">إنشاء الحساب</button>
      <p id="authMessage" style="color:#e5484d;margin-top:12px;"></p>
    </form>

    <p>لديك حساب؟ <a href="login.html" style="color:#635bff">تسجيل الدخول</a></p>
  </div>
</main>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDFVBBCpwx_afmIvpvs7rJscYXEYO2qrYk",
    authDomain: "markethub-84d49.firebaseapp.com",
    projectId: "markethub-84d49",
    storageBucket: "markethub-84d49.firebasestorage.app",
    messagingSenderId: "333098836937",
    appId: "1:333098836937:web:a4ec75dc26fd51a8e37e18",
    measurementId: "G-R6XLKWQM9G"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("registerForm");
  const message = document.getElementById("authMessage");
  const button = form.querySelector("button");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const username = document.getElementById("username").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    // Username and phone remain interface fields for now.
    // Firebase Authentication stores the email/password account and display name.
    if (password.length < 8) {
      message.textContent = "كلمة المرور يجب أن تكون 8 أحرف على الأقل.";
      return;
    }

    button.disabled = true;
    button.textContent = "جاري إنشاء الحساب...";
    message.textContent = "";

    try {
      const credential = await createUserWithEmailAndPassword(auth, email, password);

      if (name) {
        await updateProfile(credential.user, {
          displayName: name
        });
      }

      window.location.href = "index.html";
    } catch (error) {
      const messages = {
        "auth/email-already-in-use": "هذا البريد الإلكتروني مستخدم بالفعل.",
        "auth/invalid-email": "البريد الإلكتروني غير صحيح.",
        "auth/weak-password": "كلمة المرور ضعيفة. استخدم 8 أحرف على الأقل.",
        "auth/operation-not-allowed": "تسجيل الدخول بالبريد الإلكتروني غير مفعّل في Firebase."
      };
      message.textContent = messages[error.code] || "حدث خطأ أثناء إنشاء الحساب.";
    } finally {
      button.disabled = false;
      button.textContent = "إنشاء الحساب";
    }
  });
</script>

</body>
</html>
