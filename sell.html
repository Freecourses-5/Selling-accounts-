<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بيع حساب</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="container nav"><a class="logo" href="index.html">Market<span>Hub</span></a><nav><a href="index.html">الرئيسية</a><a class="active" href="sell.html">بيع حساب</a></nav></div></header><main class="form-page"><div class="form-card"><span class="eyebrow">Seller Center</span><h1>إضافة حساب للبيع</h1><div class="notice">سيتم إرسال العرض للمراجعة قبل نشره. لا تضع كلمة المرور أو رموز التحقق في وصف العرض.</div><form id="sellForm"><div class="form-grid"><div class="field"><label>المنصة</label><select id="platform" required><option value="">اختر</option><option>Instagram</option><option>Facebook</option><option>TikTok</option><option>YouTube</option><option>Telegram</option><option>X</option></select></div><div class="field"><label>عدد المتابعين/المشتركين</label><input id="followers" placeholder="مثال: 25K" required></div><div class="field full"><label>عنوان العرض</label><input id="title" required></div><div class="field"><label>السعر بالدولار</label><input id="price" type="number" min="1" required></div><div class="field"><label>المجال</label><input id="niche" placeholder="Technology" required></div><div class="field"><label>عمر الحساب</label><input id="age" placeholder="3 سنوات" required></div><div class="field"><label>معرّف الحساب</label><input id="handle" placeholder="@username"></div><div class="field full"><label>الوصف</label><textarea id="description" placeholder="اذكر المعلومات المسموح بعرضها فقط."></textarea></div></div><button class="btn primary" style="width:100%">إرسال للمراجعة</button></form></div></main><script>
document.getElementById('sellForm').addEventListener('submit',e=>{e.preventDefault();const p=document.getElementById('platform').value;const cls={Instagram:'ig',Facebook:'fb',TikTok:'tt',YouTube:'yt',Telegram:'tg',X:'x'}[p];const icon={Instagram:'◎',Facebook:'f',TikTok:'♪',YouTube:'▶',Telegram:'➤',X:'𝕏'}[p];const item={id:Date.now(),platform:p,title:title.value,followers:followers.value,price:Number(price.value),niche:niche.value,age:age.value,handle:handle.value,description:description.value,cls,icon,status:'pending'};const old=JSON.parse(localStorage.getItem('mh_listings')||'[]');old.unshift(item);localStorage.setItem('mh_listings',JSON.stringify(old));alert('تم إرسال العرض للمراجعة.');location.href='index.html#listings';});
</script></body></html>
