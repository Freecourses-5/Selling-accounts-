<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تسجيل الدخول - MarketHub</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Tahoma,sans-serif;background:#0b0f14;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:430px;background:#121820;border:1px solid #26313d;border-radius:18px;padding:30px 24px;box-shadow:0 15px 45px rgba(0,0,0,.35)}.brand{text-align:center;font-size:30px;font-weight:800;margin-bottom:8px;background:linear-gradient(90deg,#ffb300,#ff6b00);-webkit-background-clip:text;background-clip:text;color:transparent}.subtitle{text-align:center;color:#9da8b5;margin:0 0 28px}label{display:block;margin:0 0 8px;font-size:14px;color:#dce2e8}input{width:100%;height:50px;padding:0 15px;border-radius:10px;border:1px solid #34414e;background:#0d131a;color:#fff;outline:none;margin-bottom:17px;font-size:15px}input:focus{border-color:#ff9800}button{width:100%;height:50px;border:0;border-radius:10px;background:linear-gradient(90deg,#ffb300,#ff6a00);color:#111;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.65;cursor:not-allowed}.message{display:none;margin:15px 0 0;padding:12px;border-radius:9px;font-size:14px;line-height:1.6}.error{display:block;background:#35171b;color:#ffb7bd;border:1px solid #6b292f}.success{display:block;background:#12321f;color:#a9f0bf;border:1px solid #24643b}.links{text-align:center;margin-top:20px;color:#9da8b5;font-size:14px}.links a{color:#ffad22;text-decoration:none;font-weight:700}.back{display:block;text-align:center;margin-top:14px;color:#8d98a5;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<main class="card"><div class="brand">MarketHub</div><p class="subtitle">تسجيل الدخول إلى حسابك</p>
<form id="loginForm" novalidate><label for="email">البريد الإلكتروني</label><input id="email" name="email" type="email" autocomplete="email" placeholder="example@email.com" required><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required><button id="loginBtn" type="submit">تسجيل الدخول</button><div id="message" class="message" role="alert"></div></form>
<div class="links">ليس لديك حساب؟ <a href="./register.html">إنشاء حساب</a></div><a class="back" href="./index.html">العودة إلى الرئيسية</a></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyDFVBBCpwx_afmIvpvs7rJscYXEYO2qrYk",authDomain:"markethub-84d49.firebaseapp.com",projectId:"markethub-84d49",storageBucket:"markethub-84d49.firebasestorage.app",messagingSenderId:"333098836937",appId:"1:333098836937:web:a4ec75dc26fd51a8e37e18",measurementId:"G-R6XLKWQM9G"};
const app=initializeApp(firebaseConfig),auth=getAuth(app);const form=document.getElementById("loginForm"),email=document.getElementById("email"),password=document.getElementById("password"),button=document.getElementById("loginBtn"),message=document.getElementById("message");
function showMessage(text,type="error"){message.textContent=text;message.className="message "+type}
onAuthStateChanged(auth,user=>{if(user) window.location.replace("./index.html")});
form.addEventListener("submit",async e=>{e.preventDefault();const ev=email.value.trim(),pv=password.value;if(!ev||!pv){showMessage("اكتب البريد الإلكتروني وكلمة المرور.");return}button.disabled=true;button.textContent="جاري تسجيل الدخول...";message.className="message";try{await setPersistence(auth,browserLocalPersistence);await signInWithEmailAndPassword(auth,ev,pv);showMessage("تم تسجيل الدخول بنجاح، جاري تحويلك...","success");setTimeout(()=>window.location.replace("./index.html"),500)}catch(error){console.error(error);let t="حدث خطأ أثناء تسجيل الدخول.";switch(error.code){case"auth/invalid-credential":case"auth/invalid-login-credentials":t="البريد الإلكتروني أو كلمة المرور غير صحيحة.";break;case"auth/user-not-found":t="لا يوجد حساب بهذا البريد الإلكتروني.";break;case"auth/wrong-password":t="كلمة المرور غير صحيحة.";break;case"auth/invalid-email":t="البريد الإلكتروني غير صالح.";break;case"auth/user-disabled":t="تم تعطيل هذا الحساب.";break;case"auth/too-many-requests":t="تمت محاولات كثيرة. انتظر قليلًا ثم حاول مرة أخرى.";break;case"auth/network-request-failed":t="تحقق من اتصال الإنترنت وحاول مرة أخرى.";break;case"auth/operation-not-allowed":t="تسجيل الدخول بالبريد الإلكتروني غير مفعّل في Firebase.";break;case"auth/unauthorized-domain":t="نطاق الموقع غير مضاف إلى النطاقات المصرح بها في Firebase."}showMessage(t);button.disabled=false;button.textContent="تسجيل الدخول"}});
</script>
</body></html>
