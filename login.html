<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="container nav">
    <a class="logo" href="index.html">Market<span>Hub</span></a>
  </div>
</header>

<main class="form-page">
  <div class="form-card">
    <span class="eyebrow">Account</span>
    <h1>تسجيل الدخول</h1>

    <form id="loginForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="btn primary" style="width:100%" type="submit">دخول</button>
      <p id="authMessage" style="color:#e5484d;margin-top:12px;"></p>
    </form>

    <p>ليس لديك حساب؟ <a href="register.html" style="color:#635bff">إنشاء حساب</a></p>
  </div>
</main>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDFVBBCpwx_afmIvpvs7rJscYXEYO2qrYk",
    authDomain: "markethub-84d49.firebaseapp.com",
    projectId: "markethub-84d49",
    storageBucket: "markethub-84d49.firebasestorage.app",
    messagingSenderId: "333098836937",
    appId: "1:333098836937:web:a4ec75dc26fd51a8e37e18",
    measurementId: "G-R6XLKWQM9G"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("loginForm");
  const message = document.getElementById("authMessage");
  const button = form.querySelector("button");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "جاري تسجيل الدخول...";
    message.textContent = "";

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "index.html";
    } catch (error) {
      const messages = {
        "auth/invalid-credential": "البريد الإلكتروني أو كلمة المرور غير صحيحة.",
        "auth/invalid-email": "البريد الإلكتروني غير صحيح.",
        "auth/user-disabled": "هذا الحساب تم تعطيله.",
        "auth/too-many-requests": "تمت محاولات كثيرة. حاول مرة أخرى لاحقًا."
      };
      message.textContent = messages[error.code] || "حدث خطأ أثناء تسجيل الدخول.";
    } finally {
      button.disabled = false;
      button.textContent = "دخول";
    }
  });
</script>

</body>
</html>
